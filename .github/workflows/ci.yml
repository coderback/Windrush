name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      # WeasyPrint's libraries and the CV template's font, as in api/Dockerfile: the PDF tests
      # measure page counts, so they must lay out with the same font as production.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-liberation
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  browser:
    name: Browser-agent tests (headless Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m browser

  compose:
    name: Docker config (compose + nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Placeholder values for the two secrets the file requires: this only parses and resolves
      # the file (a YAML slip once left it unusable on main), nothing is started.
      - name: docker-compose.yml resolves
        run: docker compose config -q
        env:
          JWT_SECRET: ci
          CREDENTIALS_KEY: ci
      # The upstreams use `resolve`, so this passes without the other services running.
      - name: nginx.conf is valid
        run: docker run --rm -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
