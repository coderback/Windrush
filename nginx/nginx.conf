events {}
http {
  # Re-resolve the service names through Docker's DNS: a rebuilt api / frontend container gets a new
  # IP, which nginx would otherwise never learn (502s until nginx restarts). `resolve` in an upstream
  # needs nginx 1.27.3+; it also lets nginx start before the other containers are up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream frontend { zone frontend 64k; server frontend:3000 resolve; }
  upstream api { zone api 64k; server api:8000 resolve; }

  server {
    listen 80;

    # /api/apply — SSE, long timeout for browser automation + user pause
    location /api/apply {
      proxy_pass http://api/apply;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      proxy_read_timeout 600s;
    }

    # /api/browser-input — short POST to relay user instructions into browser session
    location /api/browser-input/ {
      proxy_pass http://api/browser-input/;
      proxy_set_header Host $host;
    }

    # /api/browser-stream — SSE live screencast frames
    location /api/browser-stream/ {
      proxy_pass http://api/browser-stream/;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      proxy_read_timeout 600s;
    }

    # /api/upload — PDF upload, returns cv_session_id (generous timeout for large files)
    location /api/upload {
      proxy_pass http://api/upload;
      proxy_set_header Host $host;
      client_max_body_size 20m;
      proxy_read_timeout 60s;
    }

    # /api/apply → http://api/apply, /api/health → http://api/health, etc.
    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_read_timeout 600s;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
    }
  }
}
