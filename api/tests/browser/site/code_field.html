<!doctype html>
<html><head><meta charset="utf-8"><title>Test Application Form, wanting the emailed code in one field</title></head>
<body style="margin:0;font-family:sans-serif">
<form id="f" onsubmit="event.preventDefault();">
  <label style="position:absolute;left:20px;top:105px">Full name</label>
  <input id="name" name="name" style="position:absolute;left:140px;top:100px;width:300px;height:30px">
  <p style="position:absolute;left:20px;top:150px;width:600px">We emailed you a one-time code. Enter it below to finish your application.</p>
  <label for="otp" style="position:absolute;left:20px;top:215px">Verification code</label>
  <input id="otp" name="otp" style="position:absolute;left:180px;top:210px;width:200px;height:30px">
  <button id="submit" type="submit" style="position:absolute;left:20px;top:280px;width:200px;height:40px">Submit application</button>
</form>
</body></html>
