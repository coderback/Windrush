<!doctype html>
<html><head><meta charset="utf-8"><title>Create account and apply</title></head>
<body style="margin:0;font-family:sans-serif">
<form id="f" onsubmit="event.preventDefault(); document.body.innerHTML = '<h1 id=ok>Application received - thank you</h1>';">
  <label style="position:absolute;left:20px;top:105px">Full name</label>
  <input id="name" name="name" style="position:absolute;left:100px;top:100px;width:300px;height:30px">
  <label style="position:absolute;left:20px;top:250px">Create a password</label>
  <!-- what React's controlled <input> does: value attribute kept in sync with the typed value -->
  <input id="pw" name="password" type="password" oninput="this.setAttribute('value', this.value)"
         style="position:absolute;left:100px;top:245px;width:300px;height:30px">
  <button id="submit" type="submit" style="position:absolute;left:100px;top:400px;width:200px;height:40px">Submit application</button>
</form>
</body></html>
