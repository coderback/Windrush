<!doctype html>
<html><head><meta charset="utf-8"><title>Screening questions</title>
<style>body { font-family: sans-serif; margin: 20px; } .field { margin: 12px 0; }</style></head>
<body>
<form id="f" onsubmit="event.preventDefault(); window.__submitted = true;">
  <fieldset class="field"><legend>Will you require visa sponsorship?<span>*</span></legend>
    <label><input type="radio" name="sponsor" value="yes" required> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label></fieldset>
  <!-- a written answer: counts the input events a real paste would fire -->
  <div class="field"><label for="why">Why do you want to join us?<span>*</span></label>
    <textarea id="why" rows="6" cols="60" required
              oninput="window.__whyInputs = (window.__whyInputs || 0) + 1"></textarea></div>
  <div class="field"><label for="convictions">Do you have any unspent criminal convictions?<span>*</span></label>
    <select id="convictions" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
  <button id="submit" type="submit">Submit application</button>
</form>
</body></html>
